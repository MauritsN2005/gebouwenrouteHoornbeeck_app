<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#061327" />
  <meta name="description" content="Hoornbeeck Campusroute PWA — ontdek lokalen, verdiepingen en verdien XP en badges." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Gebouwenroute · Hoornbeeck Gouda</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Hoornbeeck College Gouda">
        <div class="brand-mark">H</div>
        <div>
          <div class="brand-title">Hoornbeeck</div>
          <div class="brand-subtitle">College <span>Gouda</span></div>
        </div>
      </div>
      <button class="icon-button" id="installBtn" hidden aria-label="Installeer app">＋</button>
    </header>

    <main id="app" class="main-content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Hoofdnavigatie">
      <button class="nav-item is-active" data-route="route">
        <span class="nav-icon">⌁</span><span>Route</span>
      </button>
      <button class="nav-item" data-route="buildings">
        <span class="nav-icon">▦</span><span>Gebouwen</span>
      </button>
      <button class="nav-item" data-route="info">
        <span class="nav-icon">ⓘ</span><span>Info</span>
      </button>
      <button class="nav-item" data-route="profile">
        <span class="nav-icon">◉</span><span>Profiel</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
